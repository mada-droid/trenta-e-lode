<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data:; font-src 'self' file: data:">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; background: transparent; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--text); overflow: hidden; user-select: none; }
  .card { margin: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.35); overflow: hidden; position: relative;
    animation: in .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes in { from { transform: translateY(30px) scale(.96); opacity: 0; } }
  .card.out { animation: out .3s ease-in forwards; } @keyframes out { to { transform: translateY(20px); opacity: 0; } }
  .hd { display: flex; gap: 12px; align-items: center; padding: 14px 16px 10px; }
  .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--panel3); }
  .hd b { display: block; font-size: 14px; } .hd small { color: var(--muted); display: block; font-size: 12px; line-height: 1.3; }
  .x { margin-left: auto; border: 0; background: var(--panel2); color: var(--muted); width: 28px; height: 28px; border-radius: 9px; cursor: pointer; font-size: 16px; flex: none; }
  .x:hover { color: var(--text); }
  .body { padding: 0 16px 12px; }
  .frame { background: #fff; border-radius: 14px; padding: 6px; display: grid; place-items: center; }
  .frame img { max-width: 100%; max-height: 330px; display: block; border-radius: 8px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .meta.full { -webkit-line-clamp: unset; }
  details { margin-top: 6px; font-size: 12px; color: var(--muted); } summary { cursor: pointer; color: var(--accent); }
  .verse { font-size: 27px; line-height: 2; text-align: center; padding: 6px 4px 2px; color: var(--text); }
  .tr { font-size: 14px; color: var(--text); opacity: .9; text-align: center; font-style: italic; margin: 4px 6px 0; }
  .ref { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .ft { display: flex; align-items: center; gap: 8px; padding: 10px 16px 14px; }
  .ft .src { font-size: 11px; color: var(--faint); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 6px 13px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .timer { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; }
  .timer i { display: block; height: 100%; background: var(--accent); width: 100%; transform-origin: left; }
  /* prayer */
  .prayer { background: linear-gradient(160deg, var(--panel) 30%, var(--panel3)); }
  .prayer .big { display: flex; align-items: baseline; gap: 12px; padding: 4px 18px 0; }
  .prayer .big b { font-size: 30px; letter-spacing: -.5px; } .prayer .big .ar { font-size: 30px; color: var(--accent2); margin-left: auto; }
  .prayer .when { padding: 0 18px; color: var(--muted); }
  .prayer svg { position: absolute; right: -10px; bottom: 40px; opacity: .12; }
  .ramadan .ic, .eid .ic { background: linear-gradient(135deg, #e3bc6a, #c98a3a); color: #2b1d08; }
  .eid { background: radial-gradient(400px 200px at 100% 0%, rgba(227,188,106,.25), transparent 70%), var(--panel); }
  .holi { padding: 2px 18px 6px; } .holi h2 { margin: 0 0 4px; font-size: 24px; } .holi p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script src="popup.js"></script>
</body>
</html>
